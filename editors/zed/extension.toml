id = "tynix"
name = "tynix"
version = "2.0.0"
schema_version = 1
authors = ["tynix contributors"]
description = "tynix (typed Nix) syntax highlighting and tynix-lsp support"
repository = "https://github.com/ubugeeei-prod/tynix"

[language_servers.tynix-lsp]
name = "tynix LSP"
# Attach to `.tynix` / `.d.tynix` (this extension) and to plain `.nix` buffers
# owned by Zed's Nix extension so existing Nix code gets ambient typing.
languages = ["tynix", "Nix"]

[language_servers.tynix-lsp.language_ids]
"tynix" = "tynix"
"Nix" = "nix"

# The grammar lives in this repository under editors/tree-sitter-tynix.
#
# NOTE: `rev` must point at a commit that contains editors/tree-sitter-tynix.
# Bump it to the merge commit of the change that introduced the grammar (and
# whenever grammar.js / src/parser.c change) before publishing the extension.
#
# For local development, point `repository` at your checkout instead:
#   repository = "file:///absolute/path/to/tynix"
# and set `rev` to a local commit sha that contains the grammar.
[grammars.tynix]
repository = "https://github.com/ubugeeei-prod/tynix"
rev = "b1fa3903b6f85b7c3ea330171aff86804a8c25a1"
path = "editors/tree-sitter-tynix"
