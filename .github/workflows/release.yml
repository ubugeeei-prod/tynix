name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-assets:
    name: Build Release Assets (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Linux release binaries are fully static (pkgsStatic / musl). Until the
    # Cachix cache is warm that means compiling the musl GHC cross compiler,
    # which can take a few hours on a cold runner.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
            label: linux-x64
            timeout: 360
            archive: tynix-${{ github.ref_name }}-linux-x64.tar.gz
            sha: tynix-${{ github.ref_name }}-linux-x64.sha256
          - os: ubuntu-24.04-arm
            label: linux-arm64
            timeout: 360
            archive: tynix-${{ github.ref_name }}-linux-arm64.tar.gz
            sha: tynix-${{ github.ref_name }}-linux-arm64.sha256
          - os: macos-latest
            label: macos-arm64
            timeout: 90
            archive: tynix-${{ github.ref_name }}-macos-arm64.tar.gz
            sha: tynix-${{ github.ref_name }}-macos-arm64.sha256
          - os: macos-15-intel
            label: macos-x64
            timeout: 120
            archive: tynix-${{ github.ref_name }}-macos-x64.tar.gz
            sha: tynix-${{ github.ref_name }}-macos-x64.sha256
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(matrix.os, 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Optional binary cache: pulls from and pushes to https://tynix.cachix.org
      # when the CACHIX_AUTH_TOKEN secret is configured, skipped otherwise.
      - name: Set up Cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tynix
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Validate release metadata
        run: nix run --accept-flake-config --inputs-from . nixpkgs#nodejs_24 -- --experimental-strip-types ./scripts/check-version-sync.ts

      # `.#release-bundle` is built natively for the runner's system, so every
      # target is produced on a matching host. The derivation itself rejects
      # binaries that are not static (Linux) or that load anything outside
      # /usr/lib and /System (macOS).
      - name: Build release bundle
        id: bundle
        run: |
          set -euo pipefail
          bundle="$(nix build --accept-flake-config --no-link --print-out-paths -L .#release-bundle | tail -n 1)"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          ls -l "$bundle/bin"

      - name: Package release archive
        env:
          REF_NAME: ${{ github.ref_name }}
          LABEL: ${{ matrix.label }}
          ARCHIVE: ${{ matrix.archive }}
          SHA: ${{ matrix.sha }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: nix run --accept-flake-config --inputs-from . nixpkgs#nodejs_24 -- --experimental-strip-types ./scripts/package-release.ts "$REF_NAME" "$LABEL" "$ARCHIVE" "$SHA" --bundle "$BUNDLE"

      - name: Verify release checksum
        env:
          SHA: ${{ matrix.sha }}
        run: nix run --accept-flake-config --inputs-from . nixpkgs#nodejs_24 -- --experimental-strip-types ./scripts/package-release.ts verify-checksum "$SHA"

      - name: Generate SBOM for release archive
        id: sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.20.5
        with:
          file: ${{ matrix.archive }}
          format: cyclonedx-json
          output-file: tynix-${{ github.ref_name }}-${{ matrix.label }}.cdx.json
          artifact-name: sbom-${{ matrix.label }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release archive, checksum, and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ matrix.archive }}
            ${{ matrix.sha }}
            tynix-${{ github.ref_name }}-${{ matrix.label }}.cdx.json

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            ./${{ matrix.archive }}
            ./${{ matrix.sha }}
            ./tynix-${{ github.ref_name }}-${{ matrix.label }}.cdx.json
          retention-days: 7

  # Runs every archive on a fresh runner that never had Nix installed, through
  # the same install.sh that https://tynix.dev/install.sh serves, so a binary
  # that still needs /nix/store fails the release before it is published.
  smoke-test-assets:
    name: Smoke Test (${{ matrix.label }}, no Nix)
    needs: build-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.label }}
          path: ./release-download/${{ github.ref_name }}

      - name: Assert Nix is absent
        run: |
          if command -v nix >/dev/null 2>&1 || [ -d /nix/store ]; then
            echo "this job must run on a machine without Nix" >&2
            exit 1
          fi

      - name: Install with install.sh from the local release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export TYNIX_DOWNLOAD_BASE="file://$PWD/release-download"
          export TYNIX_VERSION="$REF_NAME"
          export TYNIX_INSTALL_DIR="$RUNNER_TEMP/tynix/bin"
          sh ./docs/public/install.sh
          echo "$TYNIX_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Inspect binary dependencies
        run: |
          set -euo pipefail
          for bin in "$(command -v tynix)" "$(command -v tynix-lsp)"; do
            if [ "$RUNNER_OS" = macOS ]; then
              otool -L "$bin"
              if otool -L "$bin" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
                echo "$bin links libraries outside /usr/lib and /System" >&2
                exit 1
              fi
            else
              file "$bin"
              file "$bin" | grep -Eq 'statically linked|static-pie linked'
            fi
          done

      - name: Smoke test packaged binaries
        run: |
          set -euo pipefail
          # Version probes: confirms the binaries actually start.
          tynix --version
          tynix-lsp --version

          # Functional smoke against the in-tree examples and dogfood corpora, so a
          # binary that links but can't type-check anything fails the release.
          tynix check ./examples/main.tynix
          tynix check-project ./examples --format json >/dev/null
          tynix check ./dogfood/flake-surface.tynix

          # Minimal JSON-RPC handshake against the packaged LSP. We send
          # `initialize`, then `exit` (which the server handles by exiting
          # cleanly), and assert the server emits at least one JSON-RPC
          # response before terminating.
          lsp_log="$(mktemp)"
          send_message() {
            local body="$1"
            printf 'Content-Length: %s\r\n\r\n%s' "${#body}" "$body"
          }
          {
            send_message '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            send_message '{"jsonrpc":"2.0","method":"exit","params":null}'
          } | tynix-lsp --stdio >"$lsp_log" 2>&1 || true
          if ! grep -q '"jsonrpc":"2.0"' "$lsp_log"; then
            echo "tynix-lsp did not emit any JSON-RPC response during smoke test" >&2
            cat "$lsp_log" >&2
            exit 1
          fi

      - name: Run static Linux binaries on other distributions
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          bin_dir="$(dirname "$(command -v tynix)")"
          for image in alpine:latest debian:oldstable-slim; do
            echo "::group::$image"
            docker run --rm -v "$bin_dir:/opt/tynix:ro" -v "$PWD:/src:ro" -w /src "$image" \
              sh -c '/opt/tynix/tynix --version && /opt/tynix/tynix-lsp --version && /opt/tynix/tynix check ./examples/main.tynix >/dev/null'
            echo "::endgroup::"
          done

      - name: Uninstall with install.sh
        run: |
          set -euo pipefail
          TYNIX_INSTALL_DIR="$RUNNER_TEMP/tynix/bin" sh ./docs/public/install.sh --uninstall
          test ! -e "$RUNNER_TEMP/tynix/bin/tynix"

  build-vscode-extension:
    name: Build VS Code Extension
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(nix develop --accept-flake-config --command pnpm store path --silent | tail -n 1)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Mount pnpm store
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}

      - name: Cache pnpm store
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Validate release metadata
        run: nix develop --accept-flake-config --command vp run check:versions

      - name: Package VS Code extension
        run: |
          set -euo pipefail
          nix develop --accept-flake-config --command pnpm --filter tynix build
          nix develop --accept-flake-config --command pnpm --filter tynix exec vsce package --no-dependencies --out "../../tynix-vscode-$REF_NAME.vsix"

      - name: Generate SBOM for VS Code extension
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.20.5
        with:
          file: ./tynix-vscode-${{ env.REF_NAME }}.vsix
          format: cyclonedx-json
          output-file: ./tynix-vscode-${{ env.REF_NAME }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest VS Code extension and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ./tynix-vscode-${{ env.REF_NAME }}.vsix
            ./tynix-vscode-${{ env.REF_NAME }}.cdx.json

      - name: Upload VS Code extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vscode
          if-no-files-found: error
          path: |
            ./tynix-vscode-${{ github.ref_name }}.vsix
            ./tynix-vscode-${{ github.ref_name }}.cdx.json
          retention-days: 7

  publish-release:
    name: Publish Release
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs:
      - build-assets
      - smoke-test-assets
      - build-vscode-extension
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ./release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-vscode-marketplaces:
    name: Publish VS Code Extension
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs:
      - build-vscode-extension
      - publish-release
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(nix develop --accept-flake-config --command pnpm store path --silent | tail -n 1)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Mount pnpm store
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}

      - name: Cache pnpm store
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Download VS Code extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vscode
          path: ./release-vscode

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: nix develop --accept-flake-config --command pnpm --filter tynix exec vsce publish --packagePath "./release-vscode/tynix-vscode-$REF_NAME.vsix" --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: nix develop --accept-flake-config --command pnpm --filter tynix exec ovsx publish "./release-vscode/tynix-vscode-$REF_NAME.vsix" -p "$OVSX_PAT"

      - name: Skip marketplace publish
        if: ${{ env.VSCE_PAT == '' && env.OVSX_PAT == '' }}
        run: echo "No VSCE_PAT or OVSX_PAT secret configured; skipping marketplace publish."

  # Installs the just-published release through install.sh on every supported
  # platform, as `curl -fsSL https://tynix.dev/install.sh | sh` would
  # (tynix.dev/download/* redirects to these GitHub release assets).
  verify-install-script:
    name: Verify install.sh (${{ matrix.label }})
    needs: publish-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the published release
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export TYNIX_REPO="$REPOSITORY"
          export TYNIX_DOWNLOAD_BASE="https://github.com/$REPOSITORY/releases/download"
          export TYNIX_VERSION="$REF_NAME"
          export TYNIX_INSTALL_DIR="$RUNNER_TEMP/tynix/bin"
          sh ./docs/public/install.sh
          "$TYNIX_INSTALL_DIR/tynix" --version
          "$TYNIX_INSTALL_DIR/tynix-lsp" --version
          "$TYNIX_INSTALL_DIR/tynix" check ./examples/main.tynix
