name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: Metadata
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release metadata
        run: nix develop --accept-flake-config --command node --experimental-strip-types ./scripts/check-version-sync.ts

      - name: Test development script helpers
        run: nix develop --accept-flake-config --command node --experimental-strip-types --test scripts/utils.spec.ts

      - name: Check the embedded builtins prelude is up to date
        run: nix develop --accept-flake-config --command node --experimental-strip-types ./scripts/generate-prelude.ts --check

  flake:
    name: Flake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
          - macos-latest
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(matrix.os, 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run flake checks
        run: nix flake check --accept-flake-config

  haskell:
    name: Haskell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
          - macos-latest
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(matrix.os, 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mount Cabal package cache
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-cabal-packages-${{ runner.os }}-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          path: ~/.cabal/packages

      - name: Mount Cabal store
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-cabal-store-${{ runner.os }}-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          path: ~/.cabal/store

      - name: Cache Cabal dependencies
        if: ${{ !startsWith(matrix.os, 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Prime the Cabal package index
        run: nix develop --accept-flake-config --command cabal update

      - name: Build Haskell packages
        run: nix develop --accept-flake-config --command cabal build all

      - name: Test Haskell packages
        run: nix develop --accept-flake-config --command cabal test all

  fixtures:
    name: Dogfood and Examples
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mount Cabal package cache
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-cabal-packages-${{ runner.os }}-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          path: ~/.cabal/packages

      - name: Mount Cabal store
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-cabal-store-${{ runner.os }}-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          path: ~/.cabal/store

      - name: Cache Cabal dependencies
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Prime the Cabal package index
        run: nix develop --accept-flake-config --command cabal update

      - name: Check dogfood fixtures
        run: nix develop --accept-flake-config --command cabal run tynix -- check ./dogfood/flake-surface.tynix

      - name: Check example projects
        run: nix develop --accept-flake-config --command cabal run tynix -- check-project ./examples --format json

      - name: Check Nix syntax parity against nixpkgs
        run: nix develop --accept-flake-config --command bash -c 'sh scripts/check-nix-parity.sh "$(cabal list-bin tynix)" 25 1000'

  vscode:
    name: VS Code Extension
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(nix develop --accept-flake-config --command pnpm store path --silent | tail -n 1)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Mount pnpm store
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}

      - name: Cache pnpm store
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Typecheck VS Code extension
        run: nix develop --accept-flake-config --command pnpm --filter tynix check

      - name: Test VS Code extension
        run: nix develop --accept-flake-config --command pnpm --filter tynix test

      - name: Package VS Code extension
        run: |
          nix develop --accept-flake-config --command pnpm --filter tynix build
          nix develop --accept-flake-config --command pnpm --filter tynix exec vsce package --no-dependencies --out /tmp/tynix-ci.vsix

  vscode-integration:
    name: VS Code Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.8.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install VS Code runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libdrm2 libgbm1 libgtk-3-0 \
            libasound2t64 libxshmfence1 libsecret-1-0 libdbus-1-3

      - name: Run VS Code integration tests
        run: xvfb-run -a pnpm --filter tynix test:integration

  zed:
    name: Zed Extension
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mount Cargo git cache
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-git-${{ runner.os }}-${{ hashFiles('editors/zed/Cargo.lock', 'editors/zed/Cargo.toml') }}
          path: ~/.cargo/git

      - name: Mount Cargo registry cache
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-registry-${{ runner.os }}-${{ hashFiles('editors/zed/Cargo.lock', 'editors/zed/Cargo.toml') }}
          path: ~/.cargo/registry

      - name: Mount Zed target cache
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-zed-target-${{ runner.os }}-${{ hashFiles('editors/zed/Cargo.lock', 'editors/zed/Cargo.toml') }}
          path: editors/zed/target

      - name: Cache Cargo dependencies
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            editors/zed/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('editors/zed/Cargo.lock', 'editors/zed/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Zed extension
        run: nix develop --accept-flake-config --command cargo build --manifest-path editors/zed/Cargo.toml

      - name: Check Zed extension
        run: nix develop --accept-flake-config --command cargo check --manifest-path editors/zed/Cargo.toml

      - name: Test Zed extension
        run: nix develop --accept-flake-config --command cargo test --manifest-path editors/zed/Cargo.toml

  neovim:
    name: Neovim Plugin
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Neovim plugin
        run: nix develop --accept-flake-config --command nvim --headless -u NONE -c "lua vim.opt.runtimepath:append(vim.fn.getcwd() .. '/editors/neovim')" -l editors/neovim/test/config_spec.lua

      - name: Check Neovim tree-sitter integration
        run: nix develop --accept-flake-config --command sh scripts/test-neovim-treesitter.sh

  tree-sitter:
    name: Tree-sitter Grammar
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run grammar corpus tests
        working-directory: editors/tree-sitter-tynix
        run: nix develop --accept-flake-config --command tree-sitter test

      - name: Parse the repository corpus without errors
        working-directory: editors/tree-sitter-tynix
        run: nix develop --accept-flake-config --command node scripts/parse-corpus.mjs

      - name: Check editor queries are in sync and compile
        working-directory: editors/tree-sitter-tynix
        run: nix develop --accept-flake-config --command node scripts/sync-queries.mjs --check

  lint:
    name: Lint (formatters)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(nix develop --accept-flake-config --command pnpm store path --silent | tail -n 1)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Mount pnpm store
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}

      - name: Cache pnpm store
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Check shared source formatting
        run: nix develop --accept-flake-config --command node --experimental-strip-types scripts/format-source.ts --check

      - name: Check VS Code extension formatting
        run: nix develop --accept-flake-config --command pnpm --filter tynix fmt

      - name: Mount Cargo git cache
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-git-${{ runner.os }}-${{ hashFiles('editors/zed/Cargo.lock', 'editors/zed/Cargo.toml') }}
          path: ~/.cargo/git

      - name: Mount Cargo registry cache
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-registry-${{ runner.os }}-${{ hashFiles('editors/zed/Cargo.lock', 'editors/zed/Cargo.toml') }}
          path: ~/.cargo/registry

      - name: Mount Zed target cache
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.4.0
        with:
          key: ${{ github.repository }}-zed-target-${{ runner.os }}-${{ hashFiles('editors/zed/Cargo.lock', 'editors/zed/Cargo.toml') }}
          path: editors/zed/target

      - name: Cache Cargo dependencies
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            editors/zed/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('editors/zed/Cargo.lock', 'editors/zed/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Zed extension formatting
        run: nix develop --accept-flake-config --command cargo fmt --manifest-path editors/zed/Cargo.toml --all --check

  haskell-lint:
    name: Haskell Lint (fourmolu + hlint)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Haskell formatting (fourmolu)
        run: nix develop --accept-flake-config --command fourmolu --mode check packages

      - name: Lint Haskell (hlint)
        run: nix develop --accept-flake-config --command hlint packages

  ci-summary:
    name: CI Summary
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - metadata
      - flake
      - haskell
      - fixtures
      - vscode
      - vscode-integration
      - zed
      - neovim
      - tree-sitter
      - lint
      - haskell-lint
    if: ${{ always() }}
    steps:
      - name: Fail if any split check failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

      - name: Report success
        run: echo "All split CI checks passed."
