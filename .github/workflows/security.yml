name: Security

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**/*.ts"
      - "editors/vscode/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:
  schedule:
    # Weekly dependency-advisory sweep, independent of PR activity.
    - cron: "0 7 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

  audit:
    name: Dependency audit
    # Scheduled / manual only: a new upstream advisory should not retroactively
    # fail unrelated pull requests.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Rust dependencies (cargo audit)
        run: nix shell nixpkgs#cargo-audit --accept-flake-config --command cargo-audit audit --file editors/zed/Cargo.lock

      - name: Audit Node dependencies (pnpm audit)
        run: nix develop --accept-flake-config --command pnpm audit --prod
